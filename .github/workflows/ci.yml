name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Benchmark (offline mock reviewer, 24 seeded PRs x 4 configurations)
        run: python -m evals.run_evals --out /tmp/eval-results
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/eval-results
